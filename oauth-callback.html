<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<title>TavernSync — Google sign-in</title>
</head>
<body>
<p>กำลังเชื่อมต่อกับ TavernSync… หน้าต่างนี้จะปิดเอง</p>
<script>
// Google redirect กลับมาที่หน้านี้พร้อม #access_token ใน URL hash
// ส่งต่อให้หน้า SillyTavern หลักผ่าน localStorage (same-origin) แล้วปิดตัวเอง
// — ห้ามพึ่ง window.opener เพราะ Google ส่ง COOP มากับหน้า sign-in ทำ handle ตาย
(function () {
    try {
        localStorage.setItem('tavernsync_oauth_hash', location.hash || '#error=empty_hash');
    } catch (e) { /* localStorage ใช้ไม่ได้ — หน้าหลักจะ timeout เอง */ }
    window.close();
})();
</script>
</body>
</html>
